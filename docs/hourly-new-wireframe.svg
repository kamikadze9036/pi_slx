  <text x="440" y="171" class="label muted">WITHOUT SCRAP / STOPS</text><text x="440" y="213" class="value green">225 pcs</text>
  <text x="820" y="171" class="label muted">RECOVERABLE OUTPUT</text><text x="820" y="213" class="value green">+55 pcs</text>
  <text x="1200" y="171" class="label muted">IDEAL CAPACITY</text><text x="1200" y="213" class="value">240 pcs</text>
  <text x="40" y="266" class="small muted">Observed stops: 1 · Stop time: 10 min · Micro-stops: 2 min · Scrap: 10 pcs</text>
