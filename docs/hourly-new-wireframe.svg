  <rect x="777" y="396" width="10" height="10" class="orange"/><text x="797" y="407" class="body">Downtime, 10 min / 40 pcs eq.</text><text x="1085" y="407" class="small">Material feed</text><text x="1350" y="407" class="small">Source comment</text>
  <rect x="777" y="436" width="10" height="10" class="purple"/><text x="797" y="447" class="body">Micro-stops, 2 min / 8 pcs eq.</text><text x="1085" y="447" class="small">Brief interruptions</text><text x="1350" y="447" class="small muted">-</text>
  <rect x="777" y="476" width="10" height="10" class="yellow"/><text x="797" y="487" class="body">Slow running, 3 min / 12 pcs eq.</text><text x="1085" y="487" class="small">Cycle above ideal</text><text x="1350" y="487" class="small muted">-</text>
  <rect x="777" y="516" width="10" height="10" class="red"/><text x="797" y="527" class="body">Scrap, 10 pcs</text><text x="1085" y="527" class="small">Quality rejection</text><text x="1350" y="527" class="small muted">-</text>
  <text x="777" y="566" class="small muted">Stack: 170 + 10 + 40 + 8 + 12 = 240 pcs · Achieved-rate counterfactual: 170 + 10 + 45 = 225</text>
  <rect x="40" y="583" width="1520" height="108" fill="#159773" fill-opacity="0.04"/>
  <text x="125" y="626" font-size="27" font-weight="700">Total</text><text x="118" y="654" class="small muted">1 illustrative hour</text>
  <text x="289" y="626" class="body green">OK 170 / capacity 240</text><text x="289" y="651" class="small muted">Same category composition</text>
  <text x="535" y="631" text-anchor="middle" font-size="25" font-weight="700">70.8%</text><text x="685" y="631" text-anchor="middle" font-size="25" font-weight="700">+2.0s</text>
  <text x="779" y="624" class="body">Without scrap / stops: 225 pcs · Recoverable: +55 pcs</text><text x="779" y="651" class="small muted">Totals cover the full selected shift even when the hour list is filtered.</text>
  <text x="40" y="722" class="small muted">Green = OK · Red = scrap · Orange = downtime · Purple = micro-stops · Yellow = slow running</text>
  <text x="40" y="749" class="small muted">225 keeps achieved running speed; 240 assumes ideal speed. Stack equivalents use the ideal rate; recoverable output uses the achieved rate.</text>
  <text x="40" y="784" class="small muted">Illustrative complete data. In live use, missing counts, historical rates or coverage show unavailable metrics; cycles remain distinct from OK pieces.</text>
</svg>
