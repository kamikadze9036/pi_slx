<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title description">
  <title id="title">Proposed new hourly overview with a common production-loss composition</title>
  <desc id="description">Synthetic completed hour: 170 OK pieces, 10 scrap pieces, 40 downtime equivalents, 8 micro-stop equivalents and 12 speed-loss equivalents. Potential without scrap or stops at the achieved rate is 225, ideal capacity 240, efficiency 70.83 percent, actual cycle 32 versus ideal 30 seconds.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#14282b}.muted{fill:#526d72}.label{font-size:12px;letter-spacing:1px}.small{font-size:13px}.body{font-size:16px}.value{font-size:32px;font-weight:700}.white{fill:#fff}.border{stroke:#c7d5d1;fill:none}.green{fill:#159773}.red{fill:#d64b50}.orange{fill:#d78736}.purple{fill:#8a67bc}.yellow{fill:#d0a32b}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#f2f5f3"/>
