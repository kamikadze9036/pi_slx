  <text x="286" y="313" class="label muted">OUTPUT / LOSSES</text><text x="478" y="313" class="label muted">OEE</text><text x="629" y="313" class="label muted">CYCLE</text>
  <text x="775" y="313" class="label muted">TYPE</text><text x="1085" y="313" class="label muted">REASON</text><text x="1350" y="313" class="label muted">COMMENT</text>
  <text x="62" y="501" transform="rotate(-90 62 501)" class="small muted">DEMO ORDER A</text>
  <text x="102" y="433" font-size="27" font-weight="700">06:00-07:00</text><text x="151" y="465" class="small muted">PRESS</text>
