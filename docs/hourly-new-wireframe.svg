  <rect x="286" y="345" width="112" height="206" class="green"/><rect x="398" y="345" width="6.6" height="206" class="red"/>
  <rect x="404.6" y="345" width="26.3" height="206" class="orange"/><rect x="430.9" y="345" width="5.3" height="206" class="purple"/><rect x="436.2" y="345" width="7.8" height="206" class="yellow"/>
  <text x="313" y="455" class="value white">170</text>
